<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clinic Letter Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 700px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2E86C1;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
        }
        textarea, input {
            width: 100%;
            margin-bottom: 15px;
            border-radius: 5px;
            padding: 10px;
            border: 1px solid #ced4da;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #1E8449;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #148f3f;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Clinic Letter Generator</h1>
    <form method="POST">
        <label for="referring_doctor">Referring Doctor:</label>
        <input type="text" name="referring_doctor" required>

        <label for="patient_name">Patient Name:</label>
        <input type="text" name="patient_name" required>

        <label for="nhs_number">NHS Number:</label>
        <input type="text" name="nhs_number" required>

        <label for="date_of_clinic">Date of Clinic:</label>
        <input type="text" name="date_of_clinic" required>

        <label for="store_name">Store Name:</label>
        <input type="text" name="store_name" required>

        <label for="store_phone_number">Store Phone Number:</label>
        <input type="text" name="store_phone_number" required>

        <label for="audiologist">Audiologist:</label>
        <input type="text" name="audiologist" required>

        <label for="clinical_notes">Clinical Notes:</label>
        <textarea name="clinical_notes" rows="8" required placeholder="Enter findings, history, management, etc..."></textarea>

        <button type="submit">Generate Clinic Letter</button>
    </form>
</div>
</body>
</html>
